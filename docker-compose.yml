services:
  server:
    build:
      context: .
    container_name: django-server
    develop:
      watch:
        - path: ./requirements.txt
          action: rebuild
        - path: ./FusionIIIT
          target: /fusion/FusionIIIT
          action: sync
    ports:
      - 8000:8000
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13-alpine
    container_name: db
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data  # Persist database data
      - ../DB_files/db-dump.sql:/docker-entrypoint-initdb.d/db-dump.sql:ro  # Restore initial SQL dump
    environment:
      - PGDATA=/var/lib/postgresql/data/fusion
      - POSTGRES_DB=fusionlab
      - POSTGRES_USER=fusion_admin
      - POSTGRES_PASSWORD=hello123
    ports:
      - 5532:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion_admin -d fusionlab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
